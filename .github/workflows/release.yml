# Publishes a release that BRAT / manual install can use. Either push a tag equal to the
# manifest version (`git tag 0.1.1 && git push origin 0.1.1`) or run this workflow by hand
# (Actions → Release → Run workflow): the tag is then created from manifest.json's version.
name: Release
on:
  push:
    tags: ["*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION=$(node -p "require('./manifest.json').version")
          fi
          gh release create "$VERSION" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
